<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout · Bespoke Brass</title>
<link rel="icon" href="img/logo-mark.png">
<script src="qrcode.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&amp;family=Lato:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1A1712}
@media (max-width: 860px){.hide-sm{display:none !important}}
a{color:#F7F0E6}a:hover{color:#FFC263}
.btn-gold{background:linear-gradient(90deg,#FEEECB,#FFC263);color:#141414;border:0;transition:box-shadow .1s ease}
.btn-gold:hover{color:#141414;box-shadow:0 0 0 2px #FFC263}
.btn-line{border:1px solid #F7F0E6;color:#F7F0E6;background:transparent;transition:box-shadow .1s ease}
.btn-line:hover{color:#F7F0E6;box-shadow:0 0 0 1px #F7F0E6}
.field{min-height:48px;padding:0 14px;background:#26221B;border:1px solid #554D42;color:#F7F0E6;font-family:inherit;font-size:16px;box-sizing:border-box;width:100%}
.field:focus{outline:2px solid #FFC263;outline-offset:1px;border-color:#FFC263}
.field[aria-invalid="true"]{border-color:#FF8A7A}
.pay-opt{transition:border-color .2s,background .2s}
.pay-opt:hover{border-color:#FFC263}
@keyframes fadeUp{from{transform:translateY(1rem);opacity:.01}to{transform:translateY(0);opacity:1}}
.step-in{animation:fadeUp .45s cubic-bezier(0,0,.3,1) both}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>

</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">
<div style="font-family: 'Lato', sans-serif; color: #F7F0E6; background: #1A1712; min-height: 100vh">

  <div style="background: linear-gradient(90deg, #FEEECB, #FFC263); color: #141414; text-align: center; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; padding: 10px 16px">Free shipping on orders of ₹1,000+ · Delivered in 3 days · Order on WhatsApp: +91 77386 78526</div>

  <header style="background: #1A1712; border-bottom: 1px solid #3A342B">
    <div style="max-width: 1320px; margin: 0 auto; padding: 16px 24px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px">
      <a href="index.html" style="text-decoration: none; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; min-height: 44px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F7F0E6" stroke-width="1.8"><path d="M15 5l-7 7 7 7"></path></svg>Continue shopping</a>
      <a href="index.html" aria-label="Bespoke Brass, home" style="text-decoration: none; display: flex; align-items: center; gap: 12px">
        <img src="img/logo-mark.png" alt="" style="width: 52px; height: 52px; display: block">
        <span style="display: flex; flex-direction: column; align-items: center; gap: 2px">
          <span :style="`font-family: 'Raleway', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 0.22em; color: ${gold}`">BESPOKE</span>
          <span style="font-family: 'Raleway', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.6em; color: #F7F0E6; padding-left: 0.6em">BRASS</span>
        </span>
      </a>
      <div style="display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 13px; color: #CFC8BC"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFC263" stroke-width="1.6"><path d="M6 11V8a6 6 0 0 1 12 0v3"></path><path d="M5 11h14v10H5z"></path></svg><span class="hide-sm">Secure checkout</span></div>
    </div>
  </header>

  <main style="max-width: 1180px; margin: 0 auto; padding: 40px 24px 96px">
    <nav aria-label="Checkout steps" style="margin-bottom: 40px">
      <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: center">
        <template v-for="(st, idx_) in steps">
          <li :aria-current="st.current" :style="`display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: ${st.color}`">
            <span :style="st.dot">{{st.n}}</span>{{st.label}}
          </li>
        </template>
      </ol>
    </nav>

    <div style="display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
      <section style="flex: 999 1 560px; min-width: 0">

        <template v-if="isCart">
          <div class="step-in" style="display: flex; flex-direction: column; gap: 20px">
            <h1 style="margin: 0; font-family: 'Raleway', sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">Your cart</h1>
            <template v-if="cartEmpty">
              <div style="padding: 48px 24px; border: 1px solid #3A342B; background: #26221B; text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center">
                <p style="margin: 0; color: #D9D2C6; font-size: 17px">Your cart is empty.</p>
                <a href="index.html" class="btn-gold" style="text-decoration: none; padding: 15px 34px; font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase">Browse the collection</a>
              </div>
            </template>
            <template v-for="(l, idx_) in lines">
              <article style="display: flex; gap: 20px; padding: 16px; background: #26221B; border: 1px solid #3A342B; align-items: center; flex-wrap: wrap">
                <img :src="l.src" :alt="l.name" style="width: 104px; height: 104px; object-fit: cover; display: block; flex: none">
                <div style="flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
                  <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #CFC8BC">{{l.cat}}</span>
                  <span style="font-weight: 700; font-size: 17px">{{l.name}}</span>
                  <span style="color: #FFC263; font-weight: 700">{{l.lineTotal}}</span>
                </div>
                <div style="display: flex; align-items: center; gap: 12px">
                  <div style="display: flex; align-items: center; border: 1px solid #554D42">
                    <button @click="l.dec" :aria-label="`Decrease quantity of ${l.name}`" style="width: 44px; height: 46px; border: 0; background: none; color: #F7F0E6; font-size: 20px; cursor: pointer">−</button>
                    <span aria-live="polite" style="min-width: 28px; text-align: center; font-weight: 700">{{l.qty}}</span>
                    <button @click="l.inc" :aria-label="`Increase quantity of ${l.name}`" style="width: 44px; height: 46px; border: 0; background: none; color: #F7F0E6; font-size: 20px; cursor: pointer">+</button>
                  </div>
                  <button @click="l.remove" :aria-label="`Remove ${l.name}`" style="width: 44px; height: 44px; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#CFC8BC" stroke-width="1.6"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
                </div>
              </article>
            </template>
            <template v-if="cartFull">
              <button @click="toDetails" class="btn-gold" style="align-self: flex-start; min-height: 54px; padding: 0 40px; font-family: inherit; font-weight: 700; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer">Checkout</button>
            </template>
          </div>
        </template>

        <template v-if="isDetails">
          <form class="step-in" @submit="submitDetails" novalidate="" style="display: flex; flex-direction: column; gap: 18px">
            <h1 style="margin: 0; font-family: 'Raleway', sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">Delivery details</h1>
            <p style="margin: 0; color: #CFC8BC">We'll send your order updates on WhatsApp. Fields marked <span style="color: #FF5A4A">*</span> are required.</p>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label for="co-name" style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em">Full name<span aria-hidden="true" style="color: #FF5A4A"> *</span></label>
              <input id="co-name" aria-required="true" class="field" autocomplete="name" :value="f.name" @input="set.name" :aria-invalid="inv.name">
              <template v-if="err.name"><span style="color: #FF8A7A; font-size: 14px">{{err.name}}</span></template>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px">
              <div style="display: flex; flex-direction: column; gap: 6px">
                <label for="co-phone" style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em">WhatsApp number<span aria-hidden="true" style="color: #FF5A4A"> *</span></label>
                <input id="co-phone" aria-required="true" class="field" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="10-digit mobile number" :value="f.phone" @input="set.phone" :aria-invalid="inv.phone">
                <template v-if="err.phone"><span style="color: #FF8A7A; font-size: 14px">{{err.phone}}</span></template>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <label for="co-email" style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em">Email <span style="color: #CFC8BC; font-weight: 400">(optional)</span></label>
                <input id="co-email" class="field" type="email" autocomplete="email" :value="f.email" @input="set.email">
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label for="co-address" style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em">Address<span aria-hidden="true" style="color: #FF5A4A"> *</span></label>
              <input id="co-address" aria-required="true" class="field" autocomplete="street-address" placeholder="House no., building, street, area" :value="f.address" @input="set.address" :aria-invalid="inv.address">
              <template v-if="err.address"><span style="color: #FF8A7A; font-size: 14px">{{err.address}}</span></template>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 18px">
              <div style="display: flex; flex-direction: column; gap: 6px">
                <label for="co-city" style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em">City<span aria-hidden="true" style="color: #FF5A4A"> *</span></label>
                <input id="co-city" aria-required="true" list="co-cities" class="field" autocomplete="address-level2" :value="f.city" @input="set.city" :aria-invalid="inv.city">
                <datalist id="co-cities"><template v-for="(c, idx_) in cities"><option :value="c"></option></template></datalist>
                <template v-if="err.city"><span style="color: #FF8A7A; font-size: 14px">{{err.city}}</span></template>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <label for="co-state" style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em">State<span aria-hidden="true" style="color: #FF5A4A"> *</span></label>
                <input id="co-state" aria-required="true" class="field" autocomplete="address-level1" :value="f.state" @input="set.state" :aria-invalid="inv.state">
                <template v-if="err.state"><span style="color: #FF8A7A; font-size: 14px">{{err.state}}</span></template>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <label for="co-pin" style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em">PIN code<span aria-hidden="true" style="color: #FF5A4A"> *</span></label>
                <input id="co-pin" aria-required="true" class="field" inputmode="numeric" autocomplete="postal-code" maxlength="6" :value="f.pin" @input="set.pin" :aria-invalid="inv.pin">
                <template v-if="err.pin"><span style="color: #FF8A7A; font-size: 14px">{{err.pin}}</span></template>
              </div>
            </div>
            <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px">
              <button type="button" @click="toCart" class="btn-line" style="min-height: 54px; padding: 0 28px; font-family: inherit; font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer">Back</button>
              <button type="submit" class="btn-gold" style="min-height: 54px; padding: 0 40px; font-family: inherit; font-weight: 700; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer">Continue to payment</button>
            </div>
          </form>
        </template>

        <template v-if="isPay">
          <div class="step-in" style="display: flex; flex-direction: column; gap: 18px">
            <h1 style="margin: 0; font-family: 'Raleway', sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">Payment</h1>
            <div role="radiogroup" aria-label="Payment method" style="display: flex; flex-direction: column; gap: 12px">
              <button role="radio" :aria-checked="upiChecked" @click="pickUpi" class="pay-opt" :style="upiStyle">
                <span :style="upiRing"></span>
                <span style="display: flex; flex-direction: column; gap: 4px; text-align: left; flex: 1">
                  <span style="font-weight: 700; font-size: 17px">UPI</span>
                  <span style="color: #CFC8BC; font-size: 14px">Google Pay, PhonePe, Paytm or any UPI app</span>
                </span>
                <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #141414; background: #FFC263; padding: 5px 8px">Fastest</span>
              </button>
              <button role="radio" :aria-checked="codChecked" @click="pickCod" class="pay-opt" :style="codStyle">
                <span :style="codRing"></span>
                <span style="display: flex; flex-direction: column; gap: 4px; text-align: left; flex: 1">
                  <span style="font-weight: 700; font-size: 17px">Cash on Delivery</span>
                  <span style="color: #CFC8BC; font-size: 14px">Pay in cash when your order arrives</span>
                </span>
              </button>
            </div>

            <template v-if="isUpi">
              <div style="padding: 24px; background: #26221B; border: 1px solid #3A342B; display: flex; flex-wrap: wrap; gap: 28px; align-items: center">
                <div style="width: 200px; flex: none; background: #FFFFFF; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px">
                  <template v-if="hasQr"><img :src="qrSrc" :alt="`UPI QR code to pay ${total} to Mitaansh Choudhari`" style="width: 180px; height: 180px; display: block; image-rendering: pixelated"></template>
                  <span style="color: #141414; font-size: 12px; font-weight: 700">{{total}} · {{orderId}}</span>
                </div>
                <div style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
                  <span style="font-weight: 700; font-size: 17px">Scan with any UPI app</span>
                  <span style="color: #D9D2C6; line-height: 1.6">Pay <strong style="color: #FFC263">{{total}}</strong> to <strong>mitaansh13@okicici</strong> (Mitaansh Choudhari). The amount is filled in for you. On your phone? Tap the button to open your UPI app.</span>
                  <div style="display: flex; gap: 10px; flex-wrap: wrap">
                    <a :href="upiLink" class="btn-gold" style="text-decoration: none; min-height: 48px; padding: 0 24px; display: flex; align-items: center; font-weight: 700; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase">Pay {{total}} with UPI app</a>
                    <button @click="copyUpi" class="btn-line" style="min-height: 48px; padding: 0 20px; font-family: inherit; font-weight: 700; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer">{{copyLabel}}</button>
                  </div>
                </div>
                <div style="flex: 1 1 100%; display: flex; flex-direction: column; gap: 6px">
                  <label for="co-utr" style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em">UPI transaction ID (UTR)</label>
                  <input id="co-utr" class="field" inputmode="numeric" maxlength="12" placeholder="12-digit number shown in your UPI app after paying" :value="utr" @input="setUtr" :aria-invalid="utrInvalid">
                  <template v-if="utrErr"><span style="color: #FF8A7A; font-size: 14px">{{utrErr}}</span></template>
                </div>
              </div>
            </template>
            <template v-if="isCod">
              <div style="padding: 24px; background: #26221B; border: 1px solid #3A342B; color: #D9D2C6; line-height: 1.6">Keep <strong style="color: #FFC263">{{total}}</strong> ready in cash. We'll call or WhatsApp you to confirm the order before it ships.</div>
            </template>

            <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px">
              <button @click="toDetailsBack" class="btn-line" style="min-height: 54px; padding: 0 28px; font-family: inherit; font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer">Back</button>
              <button @click="placeOrder" class="btn-gold" style="min-height: 54px; padding: 0 40px; font-family: inherit; font-weight: 700; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer">{{placeLabel}}</button>
            </div>
          </div>
        </template>

        <template v-if="isDone">
          <div class="step-in" style="display: flex; flex-direction: column; gap: 18px; align-items: flex-start">
            <span style="width: 64px; height: 64px; border-radius: 32px; background: #FFC263; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.2"><path d="M5 12l5 5 9-10"></path></svg></span>
            <h1 style="margin: 0; font-family: 'Raleway', sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">Thank you, {{firstName}}</h1>
            <p style="margin: 0; color: #D9D2C6; font-size: 17px; line-height: 1.7">Order <strong style="color: #FFC263">{{orderId}}</strong> is placed. {{doneNote}}</p>
            <div style="padding: 20px; background: #26221B; border: 1px solid #3A342B; display: flex; flex-direction: column; gap: 6px; color: #D9D2C6; line-height: 1.6; align-self: stretch">
              <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #CFC8BC">Delivering to</span>
              <span>{{f.name}} · {{f.phone}}</span>
              <span>{{addressLine}}</span>
              <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #CFC8BC; margin-top: 10px">Payment</span>
              <span>{{methodLine}}</span>
            </div>
            <div style="display: flex; gap: 12px; flex-wrap: wrap">
              <a :href="waLink" target="_blank" rel="noopener" class="btn-gold" style="text-decoration: none; min-height: 54px; padding: 0 32px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="1.8"><path d="M4 12a8 8 0 1 1 3 6.2L4 20l1-3.5A8 8 0 0 1 4 12z"></path></svg>Send order on WhatsApp</a>
              <a href="index.html" class="btn-line" style="text-decoration: none; min-height: 54px; padding: 0 28px; display: flex; align-items: center; font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase">Continue shopping</a>
            </div>
          </div>
        </template>
      </section>

      <aside aria-label="Order summary" style="flex: 1 1 320px; min-width: 0; background: #26221B; border: 1px solid #3A342B; padding: 24px; display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-family: 'Raleway', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase">Order summary</h2>
        <template v-for="(l, idx_) in lines">
          <div style="display: flex; gap: 12px; align-items: center">
            <span style="position: relative; flex: none"><img :src="l.src" alt="" style="width: 56px; height: 56px; object-fit: cover; display: block"><span style="position: absolute; top: -8px; right: -8px; background: #F7F0E6; color: #141414; font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center">{{l.qty}}</span></span>
            <span style="flex: 1; min-width: 0; font-size: 14px; line-height: 1.4">{{l.name}}</span>
            <span style="font-weight: 700; font-size: 14px">{{l.lineTotal}}</span>
          </div>
        </template>
        <div style="border-top: 1px solid #443D33; padding-top: 16px; display: flex; flex-direction: column; gap: 10px; font-size: 15px">
          <div style="display: flex; justify-content: space-between"><span style="color: #CFC8BC">Subtotal</span><span>{{subtotal}}</span></div>
          <div style="display: flex; justify-content: space-between"><span style="color: #CFC8BC">Shipping</span><span style="color: #FFC263; font-weight: 700">{{shipLabel}}</span></div>
          <template v-if="shipNote"><span style="color: #CFC8BC; font-size: 13px">{{shipNote}}</span></template>
        </div>
        <div style="border-top: 1px solid #443D33; padding-top: 16px; display: flex; justify-content: space-between; align-items: baseline">
          <span style="font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 14px">Total</span>
          <span style="font-size: 24px; font-weight: 700; color: #FFC263">{{total}}</span>
        </div>
        <span style="color: #CFC8BC; font-size: 13px">Inclusive of all taxes · Delivered in 3 days</span>
      </aside>
    </div>
  </main>

  <footer style="background: #F7F0E6; color: #141414">
    <div style="max-width: 1320px; margin: 0 auto; padding: 32px 24px; font-size: 13px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap"><span style="font-family: 'Raleway', sans-serif; font-weight: 800; letter-spacing: 0.22em">© 2026 BESPOKE BRASS</span><span>+91 77386 78526 · <a href="mailto:mitaansh.choudhari.bba2026@atlasskilltech.university" style="color: inherit; overflow-wrap: anywhere">mitaansh.choudhari.bba2026@atlasskilltech.university</a></span></div>
  </footer>
</div>
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script>
const IMG = {"878e1fb3885f10dccbb05e3a26b0ef9e": "img/anchor-gold.jpg", "89e062e1d2658f0f4becf029f5ecb8b0": "img/anchor-silver.jpg", "b18d78a079158eddd781a078cc48fd49": "img/bow-blue.jpg", "c67b3586aadd195c600d0065447d7380": "img/bow-maroon.jpg", "3d72dd2559c8b4d4682312bc4ea47cd4": "img/bow-pink.jpg", "45bc81e7148f61f363798bba1b90c784": "img/bow-teal.jpg", "bad09f43c3f3a140fbb46766f9ad4ec5": "img/btn-camellia-gold.jpg", "5632cbc42b1f6e6209a323cad6cf6941": "img/btn-crystal-camellia.jpg", "9ec5fa79f18c9cfc40eebf89452e6ba1": "img/btn-pearl-lattice.jpg", "e7d3a94d9ce861639f5ad37bd3071a01": "img/btn-pearl-swirl.jpg", "8b356e987ceb618a271942c758c7cd91": "img/btn-silver-ruffle.jpg", "c09814b13bca35a1a789cd52279a4b1e": "img/btn-smoky-crystal.jpg", "b1dddba0f6e0ffcf9494fb74c8bbbeb7": "img/chains-crown.jpg", "286f017eb6c1903dfdce40e2da61f32e": "img/chains-gentleman.jpg", "aa0d72205d98ae04299165f64a503455": "img/chains-tractor.jpg", "79f2ddcbf5ab74500a4a7d906fd7196d": "img/elephant-trio.jpg", "eda9578110e79815678390b0dc82200e": "img/lint-remover.jpg", "1797d687b3004b81f843bec6d0240aae": "img/lion-gold.jpg", "091486dc486879e609aff78c0d6eac2d": "img/lion-silver.jpg", "6ae7632ca589af4fb44890c4608fb88d": "img/lioncrest-silver.jpg", "c759cd960848e9e97c00168241403491": "img/logo-full.jpg", "9f1caf7685a0077b8d8e5d6256a504ea": "img/logo-mark.png", "13571e72127f47c050f3c034617fd94e": "img/lotus-elephant.jpg", "ae1e1710753cdd22ef9a26ed10b08b66": "img/pistols-antique.jpg", "969e00aafe7719a354def93363f0c41c": "img/pistols-silver.jpg", "8cef553d3e6dc579e0b9001adfa45086": "img/radha-krishna-2.jpg", "89241c3c878b10a970b2c8abacf73022": "img/radha-krishna.jpg", "1c5c146b99c32be556ccb918be8896ec": "img/reindeer-black.jpg", "143ed874193ded8f78b14278a5aabaab": "img/reindeer-gold.jpg", "ecbb3606ed629684a7434754915e81f6": "img/reindeer-silver.jpg", "3c5c77164f6909f84bd1490bf59d4b13": "img/sewing-black.jpg", "a0ffb297e69327ee978e3f630a0423f6": "img/sewing-ivory.jpg", "9d6dac8ea905bd070908d6c65f0b3d38": "img/sheriff.jpg", "dda2275247f9db3ae3966190fd7b2602": "img/specs.jpg", "1a609dd52bfda7decedec2f11c5e47dc": "img/tiger-gold.jpg", "51bdd1840fb652f56620d231f0657873": "img/tiger-silver.jpg", "aef44a89b21a731be2e647cd09b2d342": "img/umbrella-gold-2.jpg", "332981a0d34c221fc6364ea127ba7c79": "img/umbrella-gold-3.jpg", "c3fb1a0bdbdd0dc29648b178a38808f0": "img/umbrella-gold.jpg", "7b9d8028ffd6804feaddce3abe9a0ad3": "img/umbrella-silver.jpg"};
const Cart = {
  get() { try { return JSON.parse(localStorage.getItem('bb-cart')) || []; } catch (e) { return []; } },
  set(v) { try { localStorage.setItem('bb-cart', JSON.stringify(v)); } catch (e) {} },
  count() { return Cart.get().reduce((a, x) => a + x.qty, 0); },
  add(item, q) {
    const c = Cart.get(), x = c.find((y) => y.name === item.name);
    if (x) x.qty += q; else c.push({ ...item, qty: q });
    Cart.set(c);
    return Cart.count();
  }
};
let vals;
class DCLogic {
  constructor(props) { this.props = props; this.state = {}; }
  setState(p) { Object.assign(this.state, p); Object.assign(vals, this.renderVals()); }
}

// Sample cart for the mockup; the live site fills this from the shopper's cart.
const START = [
  { cat: 'Brooches & lapel pins', name: 'Lion head brooch · antique gold', src: 'img/lion-gold.jpg', price: 250, qty: 1 },
  { cat: 'Tie & bow sets', name: 'Blue plaid tie & bow set', src: 'img/bow-blue.jpg', price: 900, qty: 1 }
];
const STEPS = ['Cart', 'Details', 'Payment', 'Confirmed'];
const KEYS = ['cart', 'details', 'pay', 'done'];
const WA = '917738678526';
// Shipping is free from this order value up; below it a flat fee applies.
const FREE_SHIP_FROM = 1000, SHIP_FEE = 100;
// Payee from the client's own Google Pay QR (decoded and checked).
// City -> state, so picking a known city fills the state. Unknown cities: state is typed by hand.
const CITY_STATE = {}, CITIES = [];
Object.entries({
  'Maharashtra': 'Mumbai,Navi Mumbai,Thane,Pune,Nagpur,Nashik,Aurangabad,Chhatrapati Sambhajinagar,Solapur,Kolhapur,Amravati,Nanded,Sangli,Jalgaon,Akola,Latur,Ahmednagar,Kalyan,Vasai-Virar,Panvel,Lonavala,Satara,Ratnagiri,Alibag',
  'Gujarat': 'Ahmedabad,Surat,Vadodara,Rajkot,Bhavnagar,Jamnagar,Gandhinagar,Junagadh,Anand,Navsari,Vapi,Bharuch,Morbi',
  'Karnataka': 'Bengaluru,Bangalore,Mysuru,Mysore,Mangaluru,Mangalore,Hubballi,Hubli,Dharwad,Belagavi,Belgaum,Kalaburagi,Udupi,Shivamogga,Davanagere',
  'Tamil Nadu': 'Chennai,Coimbatore,Madurai,Tiruchirappalli,Trichy,Salem,Tiruppur,Erode,Vellore,Tirunelveli,Thoothukudi,Hosur,Ooty',
  'Kerala': 'Kochi,Cochin,Thiruvananthapuram,Trivandrum,Kozhikode,Calicut,Thrissur,Kollam,Kannur,Alappuzha,Kottayam,Palakkad',
  'Telangana': 'Hyderabad,Secunderabad,Warangal,Karimnagar,Nizamabad,Khammam',
  'Andhra Pradesh': 'Visakhapatnam,Vizag,Vijayawada,Guntur,Nellore,Tirupati,Kurnool,Rajahmundry,Kakinada,Anantapur',
  'Delhi': 'Delhi,New Delhi',
  'Haryana': 'Gurugram,Gurgaon,Faridabad,Panipat,Ambala,Karnal,Hisar,Rohtak,Sonipat,Panchkula',
  'Uttar Pradesh': 'Noida,Greater Noida,Ghaziabad,Lucknow,Kanpur,Agra,Varanasi,Prayagraj,Allahabad,Meerut,Aligarh,Bareilly,Moradabad,Gorakhpur,Mathura,Jhansi,Ayodhya',
  'Rajasthan': 'Jaipur,Jodhpur,Udaipur,Kota,Ajmer,Bikaner,Alwar,Bhilwara,Jaisalmer',
  'Madhya Pradesh': 'Indore,Bhopal,Gwalior,Jabalpur,Ujjain,Sagar,Ratlam',
  'Punjab': 'Ludhiana,Amritsar,Jalandhar,Patiala,Bathinda,Mohali',
  'Chandigarh': 'Chandigarh',
  'West Bengal': 'Kolkata,Howrah,Durgapur,Asansol,Siliguri,Darjeeling',
  'Bihar': 'Patna,Gaya,Bhagalpur,Muzaffarpur,Darbhanga',
  'Jharkhand': 'Ranchi,Jamshedpur,Dhanbad,Bokaro',
  'Odisha': 'Bhubaneswar,Cuttack,Rourkela,Puri,Sambalpur',
  'Chhattisgarh': 'Raipur,Bhilai,Bilaspur,Durg',
  'Assam': 'Guwahati,Dibrugarh,Silchar,Jorhat',
  'Uttarakhand': 'Dehradun,Haridwar,Rishikesh,Haldwani,Nainital,Roorkee',
  'Himachal Pradesh': 'Shimla,Manali,Dharamshala,Solan,Mandi',
  'Jammu and Kashmir': 'Srinagar,Jammu',
  'Goa': 'Panaji,Panjim,Margao,Vasco da Gama,Mapusa',
  'Puducherry': 'Puducherry,Pondicherry'
}).forEach(([st, list]) => list.split(',').forEach((c) => { CITY_STATE[c.toLowerCase()] = st; CITIES.push(c); }));
const UPI_ID = 'mitaansh13@okicici', UPI_NAME = 'Mitaansh Choudhari';
const rupees = (n) => '₹' + n.toLocaleString('en-IN');

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      step: 'cart', copied: false, items: Cart.get().filter((x) => x.price), method: 'upi', utr: '', utrErr: '',
      f: { name: '', phone: '', email: '', address: '', city: '', state: '', pin: '' }, err: {}
    };
  }
  validate(f) {
    const err = {};
    const phone = f.phone.replace(/\D/g, '').replace(/^(91|0)(?=\d{10}$)/, '');
    if (!f.name.trim()) err.name = 'Enter your name.';
    if (!/^[6-9]\d{9}$/.test(phone)) err.phone = 'Enter a 10-digit Indian mobile number.';
    if (!f.address.trim()) err.address = 'Enter your address.';
    if (!f.city.trim()) err.city = 'Enter your city.';
    if (!f.state.trim()) err.state = 'Enter your state.';
    if (!/^[1-9]\d{5}$/.test(f.pin.trim())) err.pin = 'Enter a 6-digit PIN code.';
    return err;
  }
  renderVals() {
    const s = this.state;
    if (s.step !== 'done') Cart.set(s.items);
    const go = (step) => () => { this.setState({ step }); window.scrollTo(0, 0); };
    const setQty = (i, q) => this.setState({ items: s.items.map((x, j) => (j === i ? { ...x, qty: q } : x)) });
    const lines = s.items.map((x, i) => ({
      ...x,
      lineTotal: rupees(x.price * x.qty),
      inc: () => setQty(i, x.qty + 1),
      dec: () => setQty(i, Math.max(1, x.qty - 1)),
      remove: () => this.setState({ items: s.items.filter((_, j) => j !== i) })
    }));
    const sub = s.items.reduce((a, x) => a + x.price * x.qty, 0);
    const ship = sub > 0 && sub < FREE_SHIP_FROM ? SHIP_FEE : 0;
    const sum = sub + ship;
    const total = rupees(sum);
    const at = KEYS.indexOf(s.step);
    const steps = STEPS.map((label, i) => ({
      n: i + 1,
      label,
      current: i === at ? 'step' : 'false',
      color: i <= at ? '#F7F0E6' : '#A39C90',
      dot: 'width: 28px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 13px; ' + (i < at ? 'background: #FFC263; color: #141414' : i === at ? 'background: transparent; color: #FFC263; border: 2px solid #FFC263; box-sizing: border-box' : 'background: transparent; color: #A39C90; border: 1px solid #554D42; box-sizing: border-box')
    }));
    const set = {};
    Object.keys(s.f).forEach((k) => {
      set[k] = (e) => {
        const f = { ...this.state.f, [k]: e.target.value };
        if (k === 'city') {
          const st = CITY_STATE[f.city.trim().toLowerCase()];
          // Only overwrite a state we filled ourselves, never one the customer typed.
          if (st && (!f.state.trim() || f.state === this.autoState)) f.state = this.autoState = st;
        }
        // Clear a field's error once it becomes valid.
        const err = { ...this.state.err };
        const now = this.validate(f);
        Object.keys(err).forEach((x) => { if (!now[x]) delete err[x]; });
        this.setState({ f, err });
      };
    });
    const inv = {};
    Object.keys(s.f).forEach((k) => { inv[k] = s.err[k] ? 'true' : 'false'; });
    const opt = (on) => 'display: flex; align-items: center; gap: 16px; width: 100%; min-height: 76px; padding: 16px 20px; font-family: inherit; color: #F7F0E6; cursor: pointer; background: ' + (on ? '#2E271A' : '#26221B') + '; border: ' + (on ? '2px solid #FFC263' : '1px solid #554D42');
    const ring = (on) => 'width: 22px; height: 22px; flex: none; border-radius: 11px; box-sizing: border-box; border: 2px solid ' + (on ? '#FFC263' : '#A39C90') + '; background: ' + (on ? 'radial-gradient(circle, #FFC263 0 5px, transparent 6px)' : 'transparent');
    const upi = s.method === 'upi';
    const orderId = this.oid || (this.oid = 'BB-' + String(Date.now()).slice(-6));
    const addressLine = [s.f.address, s.f.city, s.f.state, s.f.pin].filter((x) => x.trim()).join(', ');
    const methodLine = upi ? 'UPI · paid ' + total + ' · UTR ' + s.utr : 'Cash on Delivery · ' + total + ' due on delivery';
    // Standard UPI deep link; the QR encodes the same string so a scan also pre-fills amount and note.
    const upiLink = 'upi://pay?pa=' + UPI_ID + '&pn=' + encodeURIComponent(UPI_NAME) + '&am=' + sum.toFixed(2) + '&cu=INR&tn=' + orderId;
    let qrSrc = '';
    if (window.qrcode && sum > 0) {
      const q = window.qrcode(0, 'M');
      q.addData(upiLink);
      q.make();
      qrSrc = q.createDataURL(6, 2);
    }
    const waText = 'New order ' + orderId + '\n' + s.items.map((x) => x.qty + ' × ' + x.name).join('\n') + '\nTotal: ' + total + '\n' + methodLine + '\n' + s.f.name + ', ' + s.f.phone + '\n' + addressLine;
    return {
      gold: this.props.gold ?? '#D4AF37',
      steps,
      isCart: s.step === 'cart',
      isDetails: s.step === 'details',
      isPay: s.step === 'pay',
      isDone: s.step === 'done',
      cartEmpty: s.items.length === 0,
      cartFull: s.items.length > 0,
      lines,
      subtotal: rupees(sub),
      shipLabel: ship ? rupees(ship) : 'Free',
      shipNote: ship ? 'Add ' + rupees(FREE_SHIP_FROM - sub) + ' more for free shipping' : '',
      total,
      toCart: go('cart'),
      toDetails: go('details'),
      toDetailsBack: go('details'),
      f: s.f,
      set,
      inv,
      err: s.err,
      submitDetails: (e) => {
        e.preventDefault();
        const err = this.validate(this.state.f);
        this.setState({ err });
        if (!Object.keys(err).length) go('pay')();
      },
      upiChecked: upi ? 'true' : 'false',
      codChecked: upi ? 'false' : 'true',
      upiStyle: opt(upi),
      codStyle: opt(!upi),
      upiRing: ring(upi),
      codRing: ring(!upi),
      pickUpi: () => this.setState({ method: 'upi' }),
      pickCod: () => this.setState({ method: 'cod', utrErr: '' }),
      isUpi: upi,
      isCod: !upi,
      utr: s.utr,
      utrErr: s.utrErr,
      utrInvalid: s.utrErr ? 'true' : 'false',
      setUtr: (e) => this.setState({ utr: e.target.value.replace(/\D/g, '').slice(0, 12), utrErr: '' }),
      placeLabel: upi ? 'I have paid · Place order' : 'Place order · Pay on delivery',
      placeOrder: () => {
        if (upi && !/^\d{12}$/.test(s.utr)) return this.setState({ utrErr: 'Enter the 12-digit UTR from your UPI app.' });
        Cart.set([]);
        go('done')();
      },
      firstName: s.f.name.trim().split(' ')[0] || 'you',
      orderId,
      addressLine,
      cities: CITIES,
      methodLine,
      doneNote: upi ? 'We will check your UPI payment and confirm on WhatsApp.' : 'We will confirm your order on WhatsApp before it ships.',
      upiLink,
      hasQr: !!qrSrc,
      qrSrc,
      copyUpi: () => {
        if (navigator.clipboard) navigator.clipboard.writeText(UPI_ID).then(() => this.setState({ copied: true }), () => {});
      },
      copyLabel: s.copied ? 'UPI ID copied' : 'Copy UPI ID',
      waLink: 'https://wa.me/' + WA + '?text=' + encodeURIComponent(waText)
    };
  }
}

const comp = new Component({"gold": "#D4AF37"});
vals = Vue.reactive(comp.renderVals());
Vue.createApp({ template: '#tpl', setup: () => vals }).mount('#app');
Vue.nextTick(() => comp.componentDidMount && comp.componentDidMount());
</script>
