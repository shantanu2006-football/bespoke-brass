  componentDidMount() {
    this.revealTimer = setTimeout(() => {
      if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      this.io = new IntersectionObserver((entries) => entries.forEach((e) => {
        if (e.isIntersecting) { e.target.classList.add('in'); this.io.unobserve(e.target); }
      }), { rootMargin: '0px 0px -60px 0px' });
      document.querySelectorAll('.stagger > *').forEach((el) => {
        if (el.getBoundingClientRect().top < window.innerHeight) return;
        el.classList.add('rv');
        this.io.observe(el);
      });
    }, 60);
  }
  componentWillUnmount() {
    clearTimeout(this.revealTimer);
    if (this.io) this.io.disconnect();
  }
  renderVals() {
    const s = this.state;
    const [cat, name, id] = CATALOG[s.pick];
    const all = CATALOG.map((x, i) => ({ cat: x[0], name: x[1], src: B(x[2]), i }));
    // Tie sets come in colours, so their page can switch between them; other products stand alone.
    const ways = cat === TIES ? all.filter((x) => x.cat === TIES) : [];
    const colour = (x) => x.name.split(' ')[0];
    const pick = (i) => () => this.setState({ pick: i, added: false });
    const thumbs = ways.map((w) => ({
      label: colour(w),
      src: w.src,
      pick: pick(w.i),
      style: 'aspect-ratio: 1 / 1; padding: 0; overflow: hidden; background: #141414; cursor: pointer; border: ' + (w.i === s.pick ? '2px solid #FFC263' : '1px solid #443D33')
    }));
    const options = ways.map((w) => ({
      label: colour(w),
      selected: w.i === s.pick ? 'true' : 'false',
      pick: pick(w.i),
      style: 'min-height: 44px; padding: 0 18px; font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; cursor: pointer; ' + (w.i === s.pick ? 'background: #F7F0E6; color: #141414; border: 1px solid #F7F0E6' : 'background: transparent; color: #F7F0E6; border: 1px solid #554D42')
    }));
    // Four picks from other categories, spread across the catalogue.
    const others = all.filter((x) => x.cat !== cat);
    const step = Math.max(1, Math.floor(others.length / 4));
    const related = [0, 1, 2, 3].map((k) => others[(s.pick + k * step) % others.length])
      .map((x) => ({ name: x.name, src: x.src, price: rupees(PRICES[x.cat]), href: 'product.html?p=' + x.i }));
    const tie = cat === TIES;
    return {
      gold: this.props.gold ?? '#D4AF37',
      photoSrc: B(id),
      photoAlt: name,
      kicker: tie ? cat + ' · Gift box' : cat,
      title: name,
      price: rupees(PRICES[cat]),
      desc: tie ? 'A matching necktie, bow tie, lapel flower and pair of cufflinks, packed in a gift box.' : BLURBS[cat],
      details: tie ? 'Includes necktie, bow tie, lapel flower and 2 cufflinks.' : 'Message us on WhatsApp for size, finish and care details.',
      hasOptions: ways.length > 1,
      giftBox: tie,
      thumbs,
      options,
      optionLabel: tie ? colour({ name }) : '',
      related,
      waHref: 'https://wa.me/' + WA + '?text=' + encodeURIComponent('Hi, I would like to order: ' + name + ' (' + rupees(PRICES[cat]) + ')'),
      qty: s.qty,
      inc: () => this.setState({ qty: s.qty + 1 }),
      dec: () => this.setState({ qty: Math.max(1, s.qty - 1) }),
      add: () => this.setState({ cart: Cart.add({ cat, name, src: B(id), price: PRICES[cat] }, s.qty), added: true }),
      addLabel: s.added ? 'Added to cart' : 'Add to cart',
      cartCount: s.cart
    };
  }
}

const comp = new Component({"gold": "#D4AF37"});
vals = Vue.reactive(comp.renderVals());
Vue.createApp({ template: '#tpl', setup: () => vals }).mount('#app');
Vue.nextTick(() => comp.componentDidMount && comp.componentDidMount());
</script>
</body>
</html>
