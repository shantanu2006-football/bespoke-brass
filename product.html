<style>
body{margin:0;background:#030303}
a{color:#F7F0E6}a:hover{color:#FFC263}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details summary span{display:inline-block;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
details[open] summary span{transform:rotate(45deg)}
details[open] p{animation:fadeUp .45s cubic-bezier(.2,.7,.2,1)}
@keyframes fadeUp{from{transform:translateY(2rem);opacity:.01}to{transform:translateY(0);opacity:1}}
.in-left{animation:fadeUp .6s cubic-bezier(0,0,.3,1) both}
.in-right>*{animation:fadeUp .6s cubic-bezier(0,0,.3,1) both}
.in-right>*:nth-child(2){animation-delay:75ms}.in-right>*:nth-child(3){animation-delay:150ms}.in-right>*:nth-child(4){animation-delay:225ms}.in-right>*:nth-child(5){animation-delay:300ms}.in-right>*:nth-child(6){animation-delay:375ms}.in-right>*:nth-child(n+7){animation-delay:450ms}
.thumb,.opt{transition:border-color .2s,background .2s,color .2s}
.thumb:hover,.opt:hover{border-color:#FFC263}
.btn-gold{background:linear-gradient(90deg,#FEEECB,#FFC263);color:#141414;border:0;transition:box-shadow .1s ease}
.btn-gold:hover{box-shadow:0 0 0 2px #FFC263}
.wa-btn{transition:background .2s,color .2s}
.wa-btn:hover{background:#F7F0E6;color:#141414}
.wa-btn:hover svg{stroke:#141414}
.rel{background:#101010;border:1px solid #1E1E1E}
.rel .ph{transition:transform .5s ease}
.rel:hover .ph{transform:scale(1.03)}
.rv{opacity:.01;transform:translateY(2rem)}
.rv.in{animation:fadeUp .6s cubic-bezier(0,0,.3,1) forwards}
.stagger>*:nth-child(2).in{animation-delay:75ms}.stagger>*:nth-child(3).in{animation-delay:150ms}.stagger>*:nth-child(4).in{animation-delay:225ms}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script>
const IMG = {"dea5cea75b90d640ef79684a31214f62": "img/p00.jpg", "b69d90fea44e726c74e952e57e3d03c3": "img/p01.jpg", "75b9a6428993c35ea00f9b843624f750": "img/p02.jpg", "6ad9c5f614285693a074e839e5e630d1": "img/p03.jpg", "af158bfbf67945b1f3de7d1e64b57548": "img/p04.jpg", "4ba5eb4bfd7d34fc68a7cdf5bbb61ad2": "img/p05.jpg", "7a01bcbfe2020658253c9786939a654b": "img/p06.jpg", "7ee9b25dda09e5d1ce3458bfca7fa067": "img/p07.jpg", "78fd23febc4f236d4a4fde9758ff1584": "img/p08.jpg", "17f814902e2da07bfa45d60c242f23a5": "img/p09.jpg", "f04b1103ba6e9a10d5fc698e55d7e44d": "img/p10.jpg", "76b4de36505c675383be7a9ed6702524": "img/p11.jpg", "52fcdda059e900f48a7bdc1d6749cf5b": "img/p12.jpg", "537f6e7451852f9cb3c421d516ae6c98": "img/p13.jpg", "da8a9686165aa6e2b6d46b1d9fb46719": "img/p14.jpg", "f725d31d346ad3f2937e15e0e5c8508b": "img/p15.jpg", "3fc23269f033a643a953ab8f86f01c0a": "img/p16.jpg", "2aa58698a8e2c1f18665588c04f6a21e": "img/p17.jpg", "a5313033dd41d49545c9a3f708d1f84e": "img/p18.jpg", "1ae5c8f073ff759cac8ca9eac0841fdd": "img/p19.jpg", "4a41cdf311bd9bcc5b499c4784c3e322": "img/p20.jpg", "bf3493c2c3f383c374243bac5ba845cb": "img/p21.jpg", "319d9046a86fb2820e6860c19b8c63b6": "img/p22.jpg", "93c628d35a51ff2ff55b0bb7987d9490": "img/p23.jpg", "e016a0c2e5fb41ad306b24a0a9ee4679": "img/p24.jpg", "8f15e2051cc0b11da11fa8f49c7f86ed": "img/p25.jpg", "31f23b24abebb328cbe32acd6711d640": "img/p26.jpg", "0d5689f972154845923d797028517c7e": "img/p27.jpg", "3fabc92d346807a602d7adaebd0e0fb0": "img/p29.jpg", "5fa0e84909807091fd0d318cab43324a": "img/p30.jpg", "67d9be052ba2631b0afb108fbc7a11ac": "img/p31.jpg", "ec82d340bac32e60e05c9cdbc2dbad80": "img/p33.jpg", "84efcbd2f1570e2ecea2b0d08da5963d": "img/p34.jpg", "affeed4508f38a83507b48237c26d5b9": "img/p35.jpg", "74b0c6491a405d98cb770fd9ebabb268": "img/p36.jpg"};
let vals;
class DCLogic {
  constructor(props) { this.props = props; this.state = {}; }
  setState(p) { Object.assign(this.state, p); Object.assign(vals, this.renderVals()); }
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { photo: 0, qty: 1, cart: 0, added: false };
  }
  // Dawn's scroll-trigger: below-the-fold blocks fade up 2rem over 0.6s when they enter view.
  componentDidMount() {
    this.revealTimer = setTimeout(() => {
      if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      this.io = new IntersectionObserver((entries) => entries.forEach((e) => {
        if (e.isIntersecting) { e.target.classList.add('in'); this.io.unobserve(e.target); }
      }), { rootMargin: '0px 0px -60px 0px' });
      document.querySelectorAll('.stagger > *').forEach((el) => {
        if (el.getBoundingClientRect().top < window.innerHeight) return;
        el.classList.add('rv');
        this.io.observe(el);
      });
    }, 60);
  }
  componentWillUnmount() {
    clearTimeout(this.revealTimer);
    if (this.io) this.io.disconnect();
  }
  renderVals() {
    const s = this.state;
    const ways = [
      { label: 'Tan & red', src: 'img/p14.jpg' },
      { label: 'Navy & teal', src: 'img/p15.jpg' },
      { label: 'Mustard & navy', src: 'img/p12.jpg' },
      { label: 'Brown & blush', src: 'img/p20.jpg' }
    ];
    const pick = (i) => () => this.setState({ photo: i });
    const thumbs = ways.map((w, i) => ({
      label: w.label,
      src: w.src,
      pick: pick(i),
      style: 'aspect-ratio: 1 / 1; padding: 0; overflow: hidden; background: #141414; cursor: pointer; border: ' + (i === s.photo ? '2px solid #FFC263' : '1px solid #2A2A2A')
    }));
    const options = ways.map((w, i) => ({
      label: w.label,
      selected: i === s.photo ? 'true' : 'false',
      pick: pick(i),
      style: 'min-height: 44px; padding: 0 18px; font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; cursor: pointer; ' + (i === s.photo ? 'background: #F7F0E6; color: #141414; border: 1px solid #F7F0E6' : 'background: transparent; color: #F7F0E6; border: 1px solid #3A3A3A')
    }));
    return {
      gold: this.props.gold ?? '#D4AF37',
      photoSrc: ways[s.photo].src,
      photoAlt: 'Plaid bow tie gift set in ' + ways[s.photo].label,
      thumbs,
      options,
      optionLabel: ways[s.photo].label,
      qty: s.qty,
      inc: () => this.setState({ qty: s.qty + 1 }),
      dec: () => this.setState({ qty: Math.max(1, s.qty - 1) }),
      add: () => this.setState({ cart: s.cart + s.qty, added: true }),
      addLabel: s.added ? 'Added to cart' : 'Add to cart',
      cartCount: s.cart
    };
  }
}

const comp = new Component({"gold": "#D4AF37"});
vals = Vue.reactive(comp.renderVals());
Vue.createApp({ template: '#tpl', setup: () => vals }).mount('#app');
Vue.nextTick(() => comp.componentDidMount && comp.componentDidMount());
</script>
