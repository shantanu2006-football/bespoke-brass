<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bespoke Brass</title>
<link rel="icon" href="img/logo-mark.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&amp;family=Lato:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#030303}
a{color:#F7F0E6}a:hover{color:#FFC263}
@media (max-width: 860px){.hide-sm{display:none !important}.stack-sm{flex-direction:column !important}}
.btn-gold{background:linear-gradient(90deg,#FEEECB,#FFC263);color:#141414;border:0;transition:box-shadow .1s ease}
.btn-gold:hover{color:#141414;box-shadow:0 0 0 2px #FFC263}
.btn-line{border:1px solid #F7F0E6;color:#F7F0E6;background:transparent;transition:box-shadow .1s ease}
.btn-line:hover{color:#F7F0E6;box-shadow:0 0 0 1px #F7F0E6}
.nav-link{text-decoration:none}
.icon-btn svg{transition:transform .2s ease}
.icon-btn:hover svg{transform:scale(1.07)}
.slide{flex:0 0 100%;height:560px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);background:#030303}
.slide-imgs{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.slide-imgs img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width: 760px){.slide{grid-template-columns:1fr;grid-template-rows:300px auto;height:640px}}
@keyframes marquee-scroll{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
.marquee{display:flex;width:max-content;animation:marquee-scroll 25s linear infinite}
.marquee-wrap{overflow:hidden}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;scrollbar-width:thin;scrollbar-color:#3A3A3A transparent}
.rail>*{scroll-snap-align:start}
.card{background:#101010;border:1px solid #1E1E1E}
.card-img{overflow:hidden}
.card-img .ph{transition:transform .5s ease}
.card:hover .card-img .ph{transform:scale(1.03)}
.outfit img{transition:transform .5s ease}
.outfit:hover img{transform:scale(1.03)}
.insta img{transition:transform .5s ease}
.insta:hover img{transform:scale(1.03)}
@keyframes slideIn{from{transform:translateY(2rem);opacity:.01}to{transform:translateY(0);opacity:1}}
.rv{opacity:.01;transform:translateY(2rem)}
.rv.in{animation:slideIn .6s cubic-bezier(0,0,.3,1) forwards;animation-delay:calc(var(--o, 0) * 75ms)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}.rv{opacity:1;transform:none}}
</style>

</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">
<div style="font-family: 'Lato', sans-serif; color: #F7F0E6; background: #030303; min-height: 100vh; position: relative">

  <div style="background: linear-gradient(90deg, #FEEECB, #FFC263); color: #141414; text-align: center; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; padding: 10px 16px">Free shipping across India · Delivered in 3 days · Order on WhatsApp: +91 77386 78526</div>

  <header style="background: #030303; border-bottom: 1px solid #1E1E1E; position: sticky; top: 0; z-index: 20">
    <div style="max-width: 1320px; margin: 0 auto; padding: 16px 24px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px">
      <nav aria-label="Main" class="hide-sm" style="display: flex; gap: 24px; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; flex-wrap: wrap">
        <a href="#top" class="nav-link">Home</a>
        <a href="#range" class="nav-link">Shop all</a>
        <a href="#categories" class="nav-link">Categories</a>
        <a href="#outfit" class="nav-link">Style guide</a>
        <a href="#story" class="nav-link">Our story</a>
      </nav>
      <a href="#top" aria-label="Bespoke Brass, home" style="grid-column: 2; text-decoration: none; display: flex; align-items: center; gap: 12px">
        <img src="img/logo-mark.png" alt="" style="width: 52px; height: 52px; display: block">
        <span style="display: flex; flex-direction: column; align-items: center; gap: 2px">
          <span :style="`font-family: 'Raleway', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 0.22em; color: ${gold}`">BESPOKE</span>
          <span style="font-family: 'Raleway', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.6em; color: #F7F0E6; padding-left: 0.6em">BRASS</span>
        </span>
      </a>
      <div style="grid-column: 3; display: flex; gap: 4px; justify-content: flex-end">
        <button aria-label="Search" class="icon-btn" style="width: 44px; height: 44px; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#F7F0E6" stroke-width="1.6"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
        <button aria-label="Wishlist" class="icon-btn hide-sm" style="width: 44px; height: 44px; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#F7F0E6" stroke-width="1.6"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg></button>
        <button aria-label="Account" class="icon-btn hide-sm" style="width: 44px; height: 44px; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#F7F0E6" stroke-width="1.6"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></button>
        <a href="checkout.html" :aria-label="`Cart, ${cartCount} items`" class="icon-btn" style="width: 44px; height: 44px; text-decoration: none; display: flex; align-items: center; justify-content: center; position: relative"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#F7F0E6" stroke-width="1.6"><path d="M5 8h14l-1 13H6L5 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg><span :style="`position: absolute; top: 4px; right: 2px; background: ${gold}; color: #141414; font-size: 11px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center`">{{cartCount}}</span></a>
      </div>
    </div>
  </header>

  <section id="top" aria-roledescription="carousel" aria-label="Featured collections" style="position: relative; overflow: hidden; border-bottom: 1px solid #1E1E1E">
    <div :style="heroTrack">
      <template v-for="(s, idx_) in heroSlides">
        <div class="slide" :aria-hidden="s.hidden">
          <div style="display: flex; flex-direction: column; justify-content: center; padding: 48px clamp(24px, 6vw, 96px); gap: 18px; min-width: 0">
            <p :style="`margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: ${gold}`">{{s.kicker}}</p>
            <h2 style="margin: 0; font-family: 'Raleway', sans-serif; font-weight: 800; font-size: clamp(34px, 4.4vw, 64px); line-height: 1.02; letter-spacing: 0.02em; text-transform: uppercase; color: #FFFFFF">{{s.title}}</h2>
            <p style="margin: 0; color: #D9D2C6; font-size: 17px; line-height: 1.6; max-width: 420px">{{s.text}}</p>
            <a href="#range" @click="s.pick" :tabindex="s.tab" class="btn-gold" style="align-self: flex-start; margin-top: 8px; text-decoration: none; padding: 16px 34px; font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase">{{s.cta}}</a>
          </div>
          <div class="slide-imgs"><img :src="s.a" alt="" loading="eager"><img :src="s.b" alt="" loading="eager"></div>
        </div>
      </template>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 20px; display: flex; justify-content: center; gap: 4px">
      <template v-for="(d, idx_) in heroDots">
        <button @click="d.pick" :aria-label="`Show slide ${d.n}`" :aria-current="d.current" style="width: 28px; height: 28px; border: 0; background: none; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center"><span :style="d.style"></span></button>
      </template>
    </div>
  </section>

  <section style="max-width: 1320px; margin: 0 auto; padding: 88px 24px 40px">
    <div data-reveal="" style="text-align: center; margin-bottom: 40px">
      <h2 style="margin: 0 0 10px; font-family: 'Raleway', sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase">The Signature Edit</h2>
      <p style="margin: 0; color: #B9B2A6; font-size: 16px">Statement pieces, picked to be noticed.</p>
    </div>
    <div class="rail" data-reveal="">
      <template v-for="(p, idx_) in featured">
        <article class="card" style="display: flex; flex-direction: column">
          <a href="product.html" class="card-img" style="display: block; position: relative; aspect-ratio: 1 / 1; background: #141414">
            <img class="ph" :src="p.src" :alt="p.name" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block">
            <span style="position: absolute; top: 12px; left: 12px; background: rgba(3,3,3,0.8); color: #FFC263; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 6px 10px">{{p.cat}}</span>
          </a>
          <div style="padding: 16px; display: flex; flex-direction: column; gap: 6px; flex: 1">
            <a href="product.html" style="text-decoration: none; font-weight: 700; font-size: 16px">{{p.name}}</a>
            <span style="color: #FFC263; font-weight: 700">{{p.price}}</span>
            <button @click="p.add" class="btn-gold" style="margin-top: auto; min-height: 46px; font-family: inherit; font-weight: 700; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer">Add to cart</button>

      </template>
    </div>
  </section>

  <section id="categories" style="padding: 64px 0 72px; overflow: hidden">

      <h2 style="margin: 0 0 10px; font-family: 'Raleway', sans-serif; font-size: 36px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase">Shop by categories</h2>
      <p style="margin: 0; color: #B9B2A6; font-size: 16px">Every finishing touch, in one place.</p>
    </div>
    <div aria-roledescription="carousel" aria-label="Categories" style="position: relative; height: 500px">
      <template v-for="(t, idx_) in tiles">
        <a href="#range" @click="t.click" :aria-label="`${t.label}, ${t.count} designs`" :style="t.style">
          <img :src="t.src" alt="" loading="lazy" :style="t.imgStyle">

        </a>
      </template>
    </div>
  </section>

  <section id="outfit" style="background: #0B0B0B; border-top: 1px solid #1E1E1E; border-bottom: 1px solid #1E1E1E">
    <div style="max-width: 1320px; margin: 0 auto; padding: 88px 24px">
      <div data-reveal="" style="text-align: center; margin-bottom: 40px">
        <p :style="`margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: ${gold}`">The Bespoke Brass style guide</p>
        <h2 style="margin: 0 0 10px; font-family: 'Raleway', sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase">Choose your outfit</h2>
        <p style="margin: 0; color: #B9B2A6; font-size: 16px">Find the piece that works with what you are wearing.</p>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px">
        <template v-for="(o, idx_) in outfits">
          <a href="#range" @click="o.pick" class="outfit" data-reveal="" :style="`--o: ${idx_}; position: relative; display: block; aspect-ratio: 3 / 4; overflow: hidden; text-decoration: none; border: 1px solid #1E1E1E`">
            <img :src="o.src" alt="" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block">
            <span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(3,3,3,0.95) 0%, rgba(3,3,3,0.3) 50%, rgba(3,3,3,0) 100%)"></span>
            <span style="position: absolute; left: 0; right: 0; bottom: 0; padding: 28px; display: flex; flex-direction: column; gap: 10px">
              <span style="font-family: 'Raleway', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: 0.08em; text-transform: uppercase; color: #FFFFFF">{{o.title}}</span>
              <span style="color: #E8E1D5; font-size: 15px; line-height: 1.55">{{o.text}}</span>
              <span style="color: #FFC263; font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase">Shop {{o.cat}} →</span>
            </span>
          </a>
        </template>
      </div>
    </div>
  </section>

  <div class="marquee-wrap" style="border-bottom: 1px solid #1E1E1E; padding: 26px 0">
    <div class="marquee" style="gap: 40px; align-items: center; font-size: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; padding-right: 40px">
      <template v-for="(t, idx_) in trust">
        <span style="display: flex; align-items: center; gap: 12px; white-space: nowrap"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFC263" stroke-width="1.6"><path :d="t.icon"></path></svg>{{t.label}}</span>

    </div>

  <section id="range" style="max-width: 1320px; margin: 0 auto; padding: 88px 24px 40px">
    <div data-reveal="" style="text-align: center; margin-bottom: 32px">
      <h2 style="margin: 0 0 10px; font-family: 'Raleway', sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase">Shop by range</h2>
      <p style="margin: 0; color: #B9B2A6; font-size: 16px">Every design ships free across India.</p>
    </div>
    <div role="group" aria-label="Filter by category" style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 40px">
      <template v-for="(c, idx_) in cats">
        <button @click="c.pick" :aria-pressed="c.selected" :style="c.style">{{c.label}}</button>
      </template>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 24px 20px">
      <template v-for="(p, idx_) in products">
        <article class="card" data-reveal="" :style="`--o: ${p.order}; display: flex; flex-direction: column`">
          <a href="product.html" class="card-img" style="display: block; position: relative; aspect-ratio: 1 / 1; background: #141414">
            <img class="ph" :src="p.src" :alt="p.name" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block">
          </a>
          <div style="padding: 16px; display: flex; flex-direction: column; gap: 6px; flex: 1">
            <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #B9B2A6">{{p.cat}}</span>
            <a href="product.html" style="text-decoration: none; font-weight: 700; font-size: 16px">{{p.name}}</a>
            <span style="color: #FFC263; font-weight: 700">{{p.price}}</span>
            <p style="margin: 0 0 8px; color: #B9B2A6; font-size: 14px; line-height: 1.5">{{p.blurb}}</p>
            <button @click="p.add" class="btn-gold" style="margin-top: auto; min-height: 46px; font-family: inherit; font-weight: 700; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer">Add to cart</button>
          </div>

      </template>
    </div>
    <template v-if="hasMore">
      <div style="display: flex; justify-content: center; margin-top: 48px">
        <button @click="showAll" class="btn-line" style="min-height: 52px; padding: 0 40px; font-family: inherit; font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer">View all {{total}} products</button>
      </div>
    </template>
  </section>

  <section id="story" style="max-width: 1320px; margin: 0 auto; padding: 80px 24px">
    <div class="stack-sm" style="display: flex; gap: 64px; align-items: center">
      <img data-reveal="" src="img/lotus-elephant.jpg" alt="Two lotus elephant brooches" loading="lazy" style="flex: 1 1 0; min-width: 0; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; border: 1px solid #1E1E1E">
      <div data-reveal="" style="--o: 1; flex: 1 1 0; min-width: 0">

        <a href="#range" class="btn-line" style="display: inline-block; text-decoration: none; padding: 15px 34px; font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase">Shop the collection</a>
      </div>
    </div>
  </section>

  <section style="border-top: 1px solid #1E1E1E">

      <div data-reveal="" style="text-align: center; margin-bottom: 32px">
        <h2 style="margin: 0 0 10px; font-family: 'Raleway', sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase">Follow us on Instagram</h2>
        <a href="#" style="color: #FFC263; font-weight: 700; letter-spacing: 0.06em">Instagram coming soon</a>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px">
        <template v-for="(i, idx_) in insta">
          <a href="#" class="insta" data-reveal="" aria-label="Open Instagram" :style="`--o: ${idx_}; display: block; aspect-ratio: 1 / 1; overflow: hidden`"><img :src="i.src" alt="" loading="lazy" style="width: 100%; height: 100%; object-fit: cover; display: block"></a>
        </template>
      </div>
    </div>
  </section>

  <footer style="background: #F7F0E6; color: #141414">
    <div style="max-width: 1320px; margin: 0 auto; padding: 72px 24px 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 40px">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <span style="display: flex; align-items: center; gap: 12px"><img src="img/logo-mark.png" alt="" style="width: 44px; height: 44px; display: block"><span style="font-family: 'Raleway', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 0.22em">BESPOKE BRASS</span></span>
        <p style="margin: 0; line-height: 1.65; color: #3D3830">Menswear accessories that finish the look.</p>
        <form style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px">
          <label for="nl-email" style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase">Subscribe to our newsletter</label>
          <div style="display: flex; flex-wrap: wrap">
            <input id="nl-email" type="email" placeholder="Your email" style="flex: 1 1 160px; min-height: 46px; padding: 0 14px; border: 1px solid #141414; background: #FFFFFF; font-family: inherit; font-size: 15px">
            <button type="button" style="min-height: 48px; padding: 0 20px; border: 0; background: #141414; color: #F7F0E6; font-family: inherit; font-weight: 700; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer">Subscribe</button>
          </div>

      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <h3 style="margin: 0 0 6px; font-size: 13px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase">Shop</h3>
        <a href="#range" style="color: #3D3830; text-decoration: none">Brooches</a>
        <a href="#range" style="color: #3D3830; text-decoration: none">Brooch &amp; button sets</a>
        <a href="#range" style="color: #3D3830; text-decoration: none">Buttons</a>
        <a href="#range" style="color: #3D3830; text-decoration: none">Lapel pins</a>
        <a href="#range" style="color: #3D3830; text-decoration: none">Collar chains</a>
        <a href="#range" style="color: #3D3830; text-decoration: none">Tie &amp; bow sets</a>
        <a href="#range" style="color: #3D3830; text-decoration: none">Garment care</a>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <h3 style="margin: 0 0 6px; font-size: 13px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase">Help</h3>
        <span style="color: #3D3830">Free shipping across India</span>

        <h3 style="margin: 0 0 6px; font-size: 13px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase">Contact</h3>
